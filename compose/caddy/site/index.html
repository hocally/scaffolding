<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Mainframe</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: radial-gradient(circle at top, #1f2937, #030712 65%); color: #f9fafb; display: flex; margin: 0; min-height: 100vh; padding: 2rem; }
      main { margin: auto; max-width: 52rem; width: 100%; }
      h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: -0.06em; margin: 0; }
      .subtitle { color: #9ca3af; font-size: 1.1rem; margin: 0.5rem 0 2rem; }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
      a { background: rgb(17 24 39 / 0.85); border: 1px solid #374151; border-radius: 1rem; color: inherit; display: block; min-height: 10rem; padding: 1.35rem; text-decoration: none; transition: border-color 150ms ease, transform 150ms ease; }
      a:hover, a:focus-visible { border-color: #60a5fa; outline: none; transform: translateY(-3px); }
      strong { display: block; font-size: 1.3rem; margin-bottom: 0.5rem; }
      span { color: #9ca3af; line-height: 1.45; }
      footer { color: #6b7280; font-size: 0.9rem; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Mainframe</h1>
      <p class="subtitle">Home services on your local network.</p>
      <section class="grid" aria-label="Services">
        <a href="/gitea/">
          <strong>Gitea</strong>
          <span>Git hosting, issues, and repositories.</span>
        </a>
        <a data-service-port="8096">
          <strong>Jellyfin</strong>
          <span>Media streaming and library management.</span>
        </a>
        <a href="/campsites">
          <strong>Campsites</strong>
          <span>Local web application.</span>
        </a>
      </section>
      <footer>LAN-only services. Keep this page off the public internet.</footer>
    </main>
    <script>
      for (const link of document.querySelectorAll('[data-service-port]')) {
        link.href = `${window.location.protocol}//${window.location.hostname}:${link.dataset.servicePort}`;
      }
    </script>
  </body>
</html>
